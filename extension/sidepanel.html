<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BetterTabs</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="bar">
    <h1 class="visually-hidden">Open tabs</h1>
    <div id="favourites" class="favourites" role="group" aria-label="Favourite tabs" hidden></div>
    <div class="finder">
      <div class="search">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.75" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m10.5 10.5 3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Search tabs" aria-label="Search tabs" aria-keyshortcuts="/" autocomplete="off" spellcheck="false">
      </div>
      <button id="locate" class="icon-button" type="button" aria-label="Show current tab" title="Show current tab">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 1.5v3M8 11.5v3M1.5 8h3M11.5 8h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <fieldset class="views">
      <legend class="visually-hidden">Organise tabs by</legend>
      <label><input type="radio" name="view" value="site" checked><span>Sites</span></label>
      <label><input type="radio" name="view" value="window"><span>Windows</span></label>
      <label><input type="radio" name="view" value="recent"><span>Recent</span></label>
      <label><input type="radio" name="view" value="group"><span>Groups</span></label>
    </fieldset>
    <div class="summary">
      <p id="count"></p>
      <button id="close-dupes" class="text-button" type="button" hidden></button>
    </div>
  </header>
  <main id="list"></main>
  <button id="settings-button" class="icon-button settings-button" type="button" popovertarget="settings" aria-label="Settings" title="Settings">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h12M2 11.5h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="10.5" cy="4.5" r="1.9" fill="var(--field)" stroke="currentColor" stroke-width="1.6"/><circle cx="5.5" cy="11.5" r="1.9" fill="var(--field)" stroke="currentColor" stroke-width="1.6"/></svg>
  </button>
  <section id="settings" popover aria-labelledby="settings-title">
    <h2 id="settings-title">Settings</h2>
    <label class="setting">
      <input id="setting-longbook" type="checkbox">
      <span>Show Add to longbook on billing and price pages</span>
    </label>
    <p class="setting-hint">Needs the longbook app on your Mac. <a href="https://longbook.app/?utm_source=bettertabs&amp;utm_medium=extension&amp;utm_campaign=add-to-longbook" target="_blank" rel="noopener">Get longbook</a></p>
    <label class="setting-field">
      <span>Open the panel in</span>
      <select id="setting-view">
        <option value="last">The view I used last</option>
        <option value="site">Sites</option>
        <option value="window">Windows</option>
        <option value="recent">Recent</option>
        <option value="group">Groups</option>
      </select>
    </label>
    <div class="setting-action">
      <button id="export-tabs" class="text-button" type="button">Export open tabs</button>
      <p class="setting-hint">Saves a file with the name and address of every open tab. Open it in any browser, or import it as bookmarks.</p>
    </div>
  </section>
  <div id="menu" popover role="menu" aria-label="Tab actions">
    <button type="button" role="menuitem" data-action="rename">Edit name</button>
    <button type="button" role="menuitem" data-action="reset" hidden>Reset name</button>
    <button type="button" role="menuitem" data-action="favourite">Add to favourites</button>
    <button type="button" role="menuitem" data-action="suspend" hidden>Suspend tab</button>
    <button type="button" role="menuitem" data-action="longbook" hidden>Add to longbook</button>
    <a role="menuitem" id="menu-get-longbook" href="https://longbook.app/?utm_source=bettertabs&amp;utm_medium=extension&amp;utm_campaign=add-to-longbook" target="_blank" rel="noopener" hidden>Get longbook</a>
  </div>
  <!-- Announces search results and closed tabs. Kept separate so routine tab updates stay silent. -->
  <p id="status" class="visually-hidden" role="status"></p>
  <script src="sidepanel.js"></script>
</body>
</html>
